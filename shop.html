<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Ambica Agencies</title>
  <meta name="description" content="Browse door handles, hinges, cabinet handles, kitchen accessories, drawer channels, locks and more from Ambica Agencies." />
  <!-- seo:start -->
  <link rel="canonical" href="https://www.ambicaagencies.in/shop.html" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta property="og:site_name" content="Ambica Agencies" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shop — Ambica Agencies" />
  <meta property="og:description" content="Browse door handles, hinges, cabinet handles, kitchen accessories, drawer channels, locks and more from Ambica Agencies." />
  <meta property="og:url" content="https://www.ambicaagencies.in/shop.html" />
  <meta property="og:image" content="https://www.ambicaagencies.in/assets/logo.webp" />
  <meta name="twitter:card" content="summary" />
  <!-- seo:end -->
  <link rel="icon" href="assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container" id="pageHero"></div>
    </section>

    <section class="section shop-section">
      <div class="container shop-layout">
        <button class="btn btn-ghost filter-toggle" id="filterToggle">Filters</button>
        <aside class="filters" id="filters">
          <div class="filter-group">
            <h4>Categories</h4>
            <div id="catList" class="cat-list"></div>
          </div>
          <div class="filter-group" id="subGroup">
            <h4>Type</h4>
            <div id="subList" class="cat-list"></div>
          </div>
          <div class="filter-group">
            <h4>Price</h4>
            <div id="priceList" class="checks"></div>
          </div>
          <div class="filter-group">
            <h4>Finish</h4>
            <div id="finishList" class="checks"></div>
          </div>
          <button class="clear-link" id="clearFilters">Clear price & finish filters</button>
        </aside>

        <div class="shop-main">
          <div class="toolbar">
            <p class="result-count" id="resultCount"></p>
            <label class="sort">Sort by
              <select id="sortSelect">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="discount">Biggest discount</option>
                <option value="name">Name A–Z</option>
              </select>
            </label>
          </div>
          <div class="grid" id="productGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
